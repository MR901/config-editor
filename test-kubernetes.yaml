apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
  labels:
    app: web-service
    environment: production
    version: v1.2.3
data:
  # Database configuration
  database_url: postgresql://db.example.com:5432/myapp
  database_pool_size: "50"
  database_timeout: "30"
  
  # Redis configuration
  redis_host: redis.example.com
  redis_port: "6379"
  redis_db: "0"
  
  # API Keys (these are test keys)
  stripe_key: sk_test_abc123xyz
  sendgrid_key: SG.test_key_xyz789
  
  # Feature flags
  enable_auth: "true"
  enable_logging: "true"
  enable_monitoring: "true"
  enable_cache: "false"
  
  # Allowed origins (comma-separated)
  cors_origins: "https://example.com,https://app.example.com,https://api.example.com"
  
  # Rate limiting
  rate_limit_rpm: "1000"
  rate_limit_burst: "100"
  
  # Timeouts (in seconds)
  timeout_connection: "30"
  timeout_read: "60"
  timeout_write: "60"
  
  # Application settings
  app_name: "Web Service"
  app_version: "1.2.3"
  app_environment: production

